name: Build Vita3K v5 Windows x64
'on':
  workflow_dispatch: {}
  push:
    paths:
    - .github/workflows/build-v5-windows.yml
permissions:
  contents: read
env:
  BUILD_CONFIG: Release
  QT_VERSION: 6.11.0
  SCCACHE_GHA_ENABLED: 'true'
jobs:
  desktop-build:
    name: Desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - platform: windows-x64
          runs_on: windows-latest
          arch: x86_64
          cmake_preset: ci-windows-msvc
          vcpkg_root: C:\vcpkg
          vcpkg_triplet: x64-windows-static-md
          cache_path: C:\vcpkg-binary-cache
          qt_install_deps: 'false'
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: recursive
        repository: erobug/Vita3K
        ref: ngs-audio-fixes-v5
        persist-credentials: false
    - name: Restore cache
      uses: actions/cache@v6
      if: ${{ matrix.cache_path != '' }}
      with:
        path: ${{ matrix.cache_path }}
        key: cache-${{ matrix.platform }}-${{ env.BUILD_CONFIG }}-${{ hashFiles('CMakeLists.txt',
          'CMakePresets.json', 'cmake/**', '.ci/**', '.github/workflows/c-cpp.yml',
          'vcpkg.json') }}
        restore-keys: 'cache-${{ matrix.platform }}-${{ env.BUILD_CONFIG }}-

          '
    - name: Set up build environment (Windows MSVC)
      shell: pwsh
      env:
        VCPKG_ROOT: ${{ matrix.vcpkg_root }}
        VCPKG_DEFAULT_BINARY_CACHE: ${{ matrix.cache_path }}
      run: 'New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE
        | Out-Null

        .\.ci\setup-windows-msvc.ps1 -VcpkgTriplet ''${{ matrix.vcpkg_triplet }}''

        '
      if: matrix.platform == 'windows-x64'
    - uses: TheMrMilchmann/setup-msvc-dev@v4
      with:
        arch: ${{ matrix.arch }}
      if: matrix.platform == 'windows-x64'
    - uses: mozilla-actions/sccache-action@v0.0.11
      if: startsWith(matrix.platform, 'linux-') || matrix.platform == 'windows-x64'
      with:
        disable_annotations: true
    - name: Install Qt 6.11.0 (Windows MSVC)
      uses: jurplel/install-qt-action@v4
      if: matrix.platform == 'windows-x64'
      with:
        version: ${{ env.QT_VERSION }}
        modules: qtmultimedia
        host: windows
        target: desktop
        arch: win64_msvc2022_64
        cache: true
        install-deps: ${{ matrix.qt_install_deps }}
        aqtsource: git+https://github.com/miurahr/aqtinstall.git@f383b3c7d9658e881bd8ce8810057393bd934ee1
    - name: Build desktop target (Windows MSVC)
      shell: bash
      env:
        VCPKG_ROOT: ${{ matrix.vcpkg_root }}
        VCPKG_DEFAULT_BINARY_CACHE: ${{ matrix.cache_path }}
      run: bash ./.ci/build-desktop.sh --preset ${{ matrix.cmake_preset }} --config
        ${{ env.BUILD_CONFIG }}
      if: matrix.platform == 'windows-x64'
    - name: Compute artifact paths
      shell: bash
      run: 'echo "GIT_SHORT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

        echo "ARTIFACT_NAME=vita3k-$(git rev-parse --short HEAD)-${{ matrix.platform
        }}" >> "$GITHUB_ENV"

        echo "ARTIFACT_DIR=artifacts/vita3k-$(git rev-parse --short HEAD)-${{ matrix.platform
        }}" >> "$GITHUB_ENV"

        '
    - name: Stage desktop artifact (Windows MSVC)
      shell: bash
      run: bash ./.ci/package-desktop.sh --platform ${{ matrix.platform }} --preset
        ${{ matrix.cmake_preset }} --config ${{ env.BUILD_CONFIG }} --output-dir "${{
        env.ARTIFACT_DIR }}"
      if: matrix.platform == 'windows-x64'
    - name: Print sccache statistics
      run: sccache --show-stats
      if: startsWith(matrix.platform, 'linux-') || matrix.platform == 'windows-x64'
    - name: Upload desktop artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.ARTIFACT_NAME }}
        path: ${{ env.ARTIFACT_DIR }}
